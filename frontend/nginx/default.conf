# Proxy reverso: único ponto de entrada do sistema, só em HTTPS (porta 443).
#
#   https://servidor/       -> arquivos do frontend (/usr/share/nginx/html)
#   https://servidor/api/   -> container da API (http://api:8000), pela rede
#                              interna do Docker
#
# Frontend e API ficam na mesma origem, então o navegador não precisa de
# CORS e a CSP só libera chamadas para o próprio site ('self'). Não existe
# servidor na porta 80: nada trafega sem criptografia.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não informa a versão do nginx nas respostas e nas páginas de erro.
    server_tokens off;

    # --- TLS ----------------------------------------------------------------
    # Certificado e chave em /etc/nginx/tls (pasta certs/ do hospedeiro). Se
    # não existirem, 30-certificado-tls.sh gera um autoassinado ao iniciar.
    ssl_certificate     /etc/nginx/tls/certificado.pem;
    ssl_certificate_key /etc/nginx/tls/chave.pem;

    # Perfil "intermediário" do Mozilla SSL Configuration Generator: só
    # TLS 1.2 e 1.3, com cifras de sigilo direto (ECDHE) e AEAD.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Nenhuma requisição legítima da API passa de poucos kB de JSON.
    client_max_body_size 64k;

    # --- Cabeçalhos de segurança -------------------------------------------
    # Valem para as páginas e também para as respostas da API (/api/), que
    # não definem cabeçalhos próprios e por isso herdam estes.
    # HSTS: o navegador passa a usar só HTTPS neste endereço. É ignorado
    # enquanto o certificado for autoassinado e não confiável.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP: scripts, estilos e imagens só do próprio site; fetch só para o
    # próprio site (a API está em /api, na mesma origem).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # --- API ---------------------------------------------------------------
    # O DNS interno do Docker (127.0.0.11) é consultado a cada 10 s. Com o
    # endereço em uma variável, o nginx não guarda o IP da API para sempre:
    # recriar o container da API (que pode mudar de IP) não quebra o proxy, e
    # o nginx sobe mesmo que a API ainda não exista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        # Sem caminho depois do endereço, a URL é repassada como chegou
        # (/api/equipamentos -> http://api:8000/api/equipamentos).
        proxy_pass $api;
        proxy_http_version 1.1;

        # $http_host mantém a porta (ex.: localhost:8443), para que URLs
        # geradas pela API (redirecionamentos) apontem para o proxy.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
