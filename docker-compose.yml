# Sobe a API e o frontend em segundo plano:  docker compose up -d --build
# Acompanha os logs:                         docker compose logs -f
# Para tudo:                                 docker compose down
#
# Único endereço de acesso: https://localhost (frontend em /, API em /api).
# O nginx do frontend é o proxy reverso; a API não tem porta publicada e só
# é alcançável pela rede interna do Docker.
services:
  api:
    build: .
    container_name: inventario-api
    environment:
      # Frontend e API estão na mesma origem (atrás do proxy): nenhuma outra
      # origem precisa chamar a API pelo navegador.
      ORIGENS_PERMITIDAS: ""
      # Confia nos cabeçalhos X-Forwarded-* enviados pelo proxy, para que o
      # log de acesso mostre o IP real do cliente e a API saiba que a
      # requisição chegou por HTTPS. Seguro porque só o proxy alcança a API.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # O banco de dados e o log de auditoria ficam no computador hospedeiro,
      # então não se perdem quando o container é recriado.
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - interna
    # Reinicia a API automaticamente se ela cair ou se o servidor reiniciar,
    # para que ela permaneça no ar (requisito 3: no mínimo 24 horas).
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: inventario-frontend
    ports:
      # Só HTTPS. Para usar outra porta no hospedeiro: PORTA_HTTPS=8443.
      - "${PORTA_HTTPS:-443}:443"
    environment:
      # Nomes extras do certificado autoassinado, separados por vírgula
      # (ex.: "inventario.exemplo.br,192.168.0.10"). Só é usado quando
      # certs/ está vazia.
      NOMES_DO_CERTIFICADO: ""
    volumes:
      # certificado.pem e chave.pem. Se não existirem, um autoassinado é
      # gerado aqui na primeira subida.
      - ./certs:/etc/nginx/tls
    networks:
      - interna
      - externa
    depends_on:
      - api
    restart: unless-stopped

networks:
  # Rede só entre os containers: sem acesso à internet e sem portas
  # publicadas. A API fica apenas nela.
  interna:
    internal: true
  # Rede com saída para o hospedeiro, necessária para publicar a porta 443.
  externa:
